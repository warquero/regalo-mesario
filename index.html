<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Regalo Mesario - Adriana de Matheus</title>
  <link rel="manifest" href="manifest.json?v=2">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/style.css?v=19">
</head>
<body>
  <div id="app">
    <!-- Página 1: Pantalla de carga -->
    <section class="page page-1 active" id="page-1">
      <div class="container">
        <div class="content">
          <h1 id="person-name">Adriana de Matheus</h1>
          <div class="heart-wrapper">
            <div class="heart" id="heart" aria-label="Toca el corazón">❤️</div>
            <p id="heart-tap-text">0%</p>
          </div>
          <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
          </div>
          <p id="tap-message">Toca el Corazón</p>
          <p id="heart-complete" class="hidden">
            ¡Completado! Preparando tu sorpresa… ❤️
          </p>
        </div>
      </div>
    </section>
  </div>
  <script src="js/script.js?v=4"></script>
</body>
</html>
